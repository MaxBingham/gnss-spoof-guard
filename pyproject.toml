[project]
name = "sfhack"
version = "0.1.0"
description = "GNSS-free drone navigation in MuJoCo: map-based visual localization + EKF (hackathon prototype)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco>=3.3",
    "numpy>=1.26",
    "scipy>=1.12",
    "opencv-python>=4.9",
    "pillow>=10.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
    "httpx>=0.27",
    "matplotlib>=3.8",
    "pytest>=8.2",
    "laspy[lazrs]>=2.5",
    "tifffile>=2024.5",
    "imagecodecs>=2024.1",
    "sounddevice>=0.5.6",
    "pymavlink>=2.4.50",
]

[project.optional-dependencies]
# Enemy-drone detector (sfhack/perception/drone_detector.py): training, evaluation, runtime.
# Ultralytics is AGPL-3.0 (see README "Enemy-drone tracker"). CUDA 12.8 wheels on Windows / Linux (PyPI torch on
# Windows is CPU-only): uv sync --extra detector
detector = [
    "torch>=2.5",
    "torchvision>=0.20",
    "ultralytics>=8.3",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sfhack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
